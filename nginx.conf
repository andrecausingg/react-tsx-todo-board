server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: redirect all 404s to index.html
    location / {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;

    # Optional: disable directory listing
    autoindex off;
}